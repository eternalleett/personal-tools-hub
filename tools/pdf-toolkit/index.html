<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Toolkit</title><style>body{font:16px system-ui;background:#f4f6fb;color:#192841;margin:0}header{background:#14213b;padding:18px}header a{color:white}main{max-width:850px;margin:30px auto;padding:0 16px}.card{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 5px 22px #14213b11}input,select,button{font:inherit;padding:10px;border-radius:8px}input[type=file]{width:95%}button{background:#425bd4;color:white;border:0;min-height:44px;cursor:pointer}button:disabled{opacity:.5}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}small{color:#64748b}#status{white-space:pre-wrap}</style><header><a href="../../">← Personal Tools Hub</a></header><main><h1>PDF Toolkit</h1><p>Merge, extract, reorder, rotate and split PDFs locally in your browser.</p><section class="card"><h2>Select PDF files</h2><input id="files" type="file" accept="application/pdf,.pdf" multiple><p id="list"></p><small>Files remain on your device; PDF processing uses pdf-lib.</small></section><section class="card"><h2>Choose operation</h2><div class="row"><select id="mode"><option value="merge">Merge PDFs</option><option value="extract">Extract selected pages</option><option value="reorder">Reorder pages</option><option value="rotate">Rotate pages</option><option value="split">Split into individual pages (ZIP)</option></select><button id="run">Process & Download</button></div><label style="display:block;margin:18px 0">Page order/range (for extract or reorder): <input id="pages" placeholder="1,3,5-7" style="width:100%;box-sizing:border-box"></label><label>Rotation: <select id="degrees"><option>90</option><option>180</option><option>270</option></select></label><p><small>For extract/reorder/rotate/split, select exactly one source PDF. Page ranges are 1-based.</small></p><p id="status" role="status"></p></section></main><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script>
const $=id=>document.getElementById(id);$('files').onchange=()=>{$('list').textContent=[...$('files').files].map(f=>f.name).join(' • ')};function download(b,name){let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}function parsePages(s,n){if(!s.trim())return Array.from({length:n},(_,i)=>i);let out=[];for(let part of s.split(',')){part=part.trim();let m=part.match(/^(\d+)(?:\s*-\s*(\d+))?$/);if(!m)throw Error('Invalid page specification: '+part);let a=+m[1],b=m[2]?+m[2]:a;if(a<1||b>n||a>b)throw Error('Page out of range: '+part);for(let k=a;k<=b;k++)out.push(k-1)}return out} $('run').onclick=async()=>{let f=[...$('files').files],mode=$('mode').value;try{if(!PDFLib)throw Error('PDF library unavailable');if(!f.length)throw Error('Select at least one PDF');if(mode!=='merge'&&f.length!==1)throw Error('Choose exactly one PDF');$('run').disabled=true;$('status').textContent='Processing…';let out=await PDFLib.PDFDocument.create();if(mode==='merge'){for(const file of f){let src=await PDFLib.PDFDocument.load(await file.arrayBuffer());let pages=await out.copyPages(src,src.getPageIndices());pages.forEach(p=>out.addPage(p))}}else{let src=await PDFLib.PDFDocument.load(await f[0].arrayBuffer());if(mode==='split'){if(!window.JSZip)throw Error('ZIP library unavailable');let zip=new JSZip();for(let i=0;i<src.getPageCount();i++){let one=await PDFLib.PDFDocument.create();one.addPage((await one.copyPages(src,[i]))[0]);zip.file('page-'+String(i+1).padStart(3,'0')+'.pdf',await one.save())}download(await zip.generateAsync({type:'blob'}),'split-pages.zip');$('status').textContent='Completed';return}let indices=mode==='rotate'?src.getPageIndices():parsePages($('pages').value,src.getPageCount());let pages=await out.copyPages(src,indices);for(let p of pages){if(mode==='rotate')p.setRotation(PDFLib.degrees((p.getRotation().angle+Number($('degrees').value))%360));out.addPage(p)}}download(new Blob([await out.save()],{type:'application/pdf'}),'pdf-toolkit-'+mode+'.pdf');$('status').textContent='Completed'}catch(e){$('status').textContent='Error: '+e.message}finally{$('run').disabled=false}};</script></html>
