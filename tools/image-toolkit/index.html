<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Toolkit</title><style>body{font:16px system-ui;background:#f4f6fb;color:#192841;margin:0}header{background:#14213b;padding:18px}header a{color:white}main{max-width:900px;margin:35px auto;padding:0 16px}.card{background:white;border-radius:16px;padding:24px;margin-bottom:16px}label{display:block;margin:14px 0}input,select,button{font:inherit;padding:10px;border-radius:8px}input[type=number]{width:100px}button{background:#425bd4;color:white;border:0;min-height:44px;cursor:pointer}button:disabled{opacity:.5}#previews{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}#previews img{max-width:100%;max-height:130px}#status{white-space:pre-wrap}</style><header><a href="../../">← Personal Tools Hub</a></header><main><h1>Image Toolkit</h1><p>Resize, convert and compress multiple images locally.</p><section class="card"><label>Images <input id="files" type="file" multiple accept="image/png,image/jpeg,image/webp,image/bmp,image/gif"></label><label>Format <select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp" selected>WebP</option></select></label><label>Maximum width (px; 0 = preserve) <input id="width" type="number" min="0" value="1200"></label><label>Maximum height (px; 0 = preserve) <input id="height" type="number" min="0" value="0"></label><label>Quality for JPEG/WebP: <output id="qualityValue">85%</output><input id="quality" type="range" min="20" max="100" value="85" oninput="document.getElementById('qualityValue').textContent=this.value+'%'"></label><button id="convert">Convert & Download</button><p id="status" role="status"></p></section><section class="card"><h2>Source previews</h2><div id="previews"></div></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script>let $=x=>document.getElementById(x);function save(b,n){let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),6000)}$('files').onchange=()=>{let wrap=$('previews');wrap.replaceChildren();for(const f of [...$('files').files].slice(0,24)){let u=URL.createObjectURL(f),box=document.createElement('div'),img=new Image;img.src=u;img.onload=()=>URL.revokeObjectURL(u);let text=document.createElement('small');text.textContent=f.name;box.append(img,text);wrap.append(box)}};async function convert(file){let u=URL.createObjectURL(file);try{let img=await new Promise((resolve,reject)=>{let i=new Image;i.onload=()=>resolve(i);i.onerror=()=>reject(Error('Cannot decode '+file.name));i.src=u});let w=img.naturalWidth,h=img.naturalHeight,mw=+$('width').value,mh=+$('height').value,s=Math.min(1,mw?mw/w:1,mh?mh/h:1);let c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));let ctx=c.getContext('2d');if($('format').value==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height)}ctx.drawImage(img,0,0,c.width,c.height);let mime=$('format').value;let blob=await new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(Error('Conversion failed')),mime,+$('quality').value/100));return blob}finally{URL.revokeObjectURL(u)}}$('convert').onclick=async()=>{let fs=[...$('files').files];try{if(!fs.length)throw Error('Select images');$('convert').disabled=true;let ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[$('format').value];let zip=new JSZip;for(let i=0;i<fs.length;i++){let f=fs[i];$('status').textContent='Processing '+(i+1)+' / '+fs.length;let blob=await convert(f),name=f.name.replace(/\.[^.]+$/,'')+'-'+String(i+1).padStart(3,'0')+'.'+ext;zip.file(name,blob)}if(fs.length===1){let name=Object.keys(zip.files)[0];save(await zip.file(name).async('blob'),name)}else save(await zip.generateAsync({type:'blob'}),'converted-images.zip');$('status').textContent='Completed'}catch(e){$('status').textContent='Error: '+e.message}finally{$('convert').disabled=false}};</script></html>
